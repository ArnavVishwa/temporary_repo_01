<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #title{
            font-size: 40px;
        }

        #nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background-color: #fff;
            height: fit-content;
            padding: 30px 10px;
        }

        #nav-links {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: auto;
            width: 40%;
            font-size: larger;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: center;
            list-style-type: none;
            text-transform: uppercase;
            /* font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; */
            color: black;
            font-weight: 500;
        }

        #nav-extras {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 10%;
            text-transform: uppercase;
            font-size: larger;
            font-weight: 500;
            color: black;
        }

        #main-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(../Images/background.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            height: 80vh;
            font-size: 40px;
            text-align: center;
        }
        #img{
            display: inline-block;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 2px solid black;
            background-image: url("https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8Y2VvJTIwd29tZW58ZW58MHx8MHx8fDA%3D");
            background-position: -23px -20px;
            background-size: 140px;
            background-repeat: no-repeat;
            margin-top: -5px;
        }
    </style>
</head>

<body>
    <div id="nav">
        <h1 id="title">Liberetty</h1>
        <ul id="nav-links">
            <li>Products<svg width="18px" height="18px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"
                    fill="#000000">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path fill="#707070"
                            d="M13.098 8H6.902c-.751 0-1.172.754-.708 1.268L9.292 12.7c.36.399 1.055.399 1.416 0l3.098-3.433C14.27 8.754 13.849 8 13.098 8Z">
                        </path>
                    </g>
                </svg></li>
            <li>3d models<svg width="18px" height="18px" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"
                    fill="#000000">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path fill="#707070"
                            d="M13.098 8H6.902c-.751 0-1.172.754-.708 1.268L9.292 12.7c.36.399 1.055.399 1.416 0l3.098-3.433C14.27 8.754 13.849 8 13.098 8Z">
                        </path>
                    </g>
                </svg></li>
            <li>gallery</li>
            <li>about</li>
            <li>contact</li>
        </ul>
        <div id="nav-extras">
            <span id="search-icon">
                <svg width="30px" height="30px" viewBox="0 0 24.00 24.00" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
                            stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>
                </svg>
            </span>
            <p>cart</p>
            <span id="user-profile">
                <svg fill="#fe5427" width="30px" height="30px" viewBox="-1 0 19 19" xmlns="http://www.w3.org/2000/svg"
                    class="cf-icon-svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                            d="M16.417 9.6A7.917 7.917 0 1 1 8.5 1.683 7.917 7.917 0 0 1 16.417 9.6zM9.666 6.508H8.248L6.09 8.09l.806 1.103 1.222-.945v4.816h1.547z">
                        </path>
                    </g>
                </svg>
            </span>
        </div>
    </div>
    <div id="main-content">
        <h1>We <span id="img"></span>produce <br> high-quality furniture <br> for lifestyle</h1>
    </div>
</body>

</html>
